name: altcheck got this wrong
description: A wrong verdict, a missed or bad alternative, or a license it misread. Every report becomes a test case.
title: "Wrong result: "
labels: ["wrong-result"]
body:
  - type: markdown
    attributes:
      value: Thanks! Reports like this are how altcheck gets more accurate. Two minutes is plenty.
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: "npx altcheck notion   or   npx altcheck vet owner/repo"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What was wrong?
      options:
        - Verdict is wrong (VIABLE / RISKY / AVOID)
        - License detected wrong
        - Listed something that isn't an alternative
        - Missed a well-known alternative
        - Other
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What altcheck said
      description: Paste the relevant line(s) of output.
      render: text
    validations:
      required: true
  - type: textarea
    id: truth
    attributes:
      label: What's actually true
      description: A link to the LICENSE, README, archive notice or project page helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: altcheck version
      placeholder: "output of: npx altcheck --version"
